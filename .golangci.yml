# golangci-lint v2 configuration for gglib.
#
# gglib is a public, multi-module library that services build on, so the
# rules are stricter than for service code: every exported
# identifier is documented, the library never exits the process or prints to
# stdout, errors are wrapped with the standard library, and correctness,
# security and test-style linters are on. Run it per module (`make lint`); the
# Makefile runs each module with GOWORK=off.
version: "2"

run:
  go: "1.27"
  timeout: 10m
  modules-download-mode: readonly
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Correctness.
    - asasalint
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - promlinter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - zerologlint
    # Security.
    - asciicheck
    - bidichk
    - gosec
    # Library hygiene and style.
    - copyloopvar
    - depguard
    - dupword
    - errname
    - forbidigo
    - gochecknoinits
    - gocritic
    - godot
    - intrange
    - mirror
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - predeclared
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    # Tests.
    - testifylint
    - thelper
    - tparallel

  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      # A switch with a default case handles every value.
      default-signifies-exhaustive: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout is not worth the churn
        - shadow # too noisy for `err` shadowing
    staticcheck:
      checks: ["all"]
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks:
        # Passing small structs such as zerolog.Logger or mctx.User by value
        # is part of the public API; switching to pointers would break callers.
        - hugeParam
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          arguments:
            # Names such as context.ContextUnaryServerInterceptor and
            # resource.ResourceManager are public API used by services.
            - disableStutteringCheck
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: error-strings
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: context-keys-type
        - name: unexported-return
        - name: indent-error-flow
        - name: blank-imports
        - name: dot-imports
        - name: range
        - name: time-naming
        - name: increment-decrement
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/ggsrc/gopkg
              desc: gopkg is the frozen predecessor; use the gglib module instead
            - pkg: io/ioutil
              desc: deprecated; use io and os
            - pkg: github.com/pkg/errors
              desc: use the standard errors package and fmt.Errorf with %w
            - pkg: github.com/golang/protobuf
              desc: deprecated; use google.golang.org/protobuf
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.Exit$
          msg: a library must return errors, not exit the process
        - pattern: ^log\.Fatal.*$
          msg: a library must return errors, not exit the process
        - pattern: ^(zerolog\.Logger\.|zerolog\.Event\.)?Fatal$
          msg: a library must return errors, not exit the process
        - pattern: ^fmt\.Print.*$
          msg: use the logger
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, fatcontext, forcetypeassert, goconst, godot, gosec, nilnil, revive]

      # zerolog/log mirrors github.com/rs/zerolog/log: these functions return
      # an event for the caller to dispatch, which zerologlint cannot see, and
      # the mirror includes Fatal for callers (gglib itself never calls it).
      - path: zerolog/log/ctx\.go
        linters: [forbidigo, zerologlint]

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ggsrc/gglib)
      custom-order: true
