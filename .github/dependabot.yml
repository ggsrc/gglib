# Weekly dependency updates, one grouped PR per ecosystem. The gglib modules
# themselves are excluded: they point at each other through replace
# directives and are versioned by scripts/release.sh. Every module directory
# must be listed (CI checks this).
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/app"
      - "/env"
      - "/grpc"
      - "/health"
      - "/interceptor"
      - "/mctx"
      - "/metric"
      - "/otel"
      - "/pprof"
      - "/ratelimit"
      - "/resource"
      - "/resource/cache"
      - "/resource/goroutine"
      - "/resource/wpgx"
      - "/safego"
      - "/snowflake"
      - "/utils"
      - "/zerolog"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: github.com/ggsrc/gglib/*
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
